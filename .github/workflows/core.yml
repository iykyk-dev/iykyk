name: Core

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build core for Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve dependencies (first run only)
        run: |
          if [ ! -f go.sum ]; then
            ./build.sh deps
          fi

      - name: Upload go.mod and go.sum
        uses: actions/upload-artifact@v7
        with:
          name: core-go-mod
          path: |
            core/go.mod
            core/go.sum

      - name: Vet
        run: go vet -tags with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,badlinkname,tfogo_checklinkname0 ./iykyk/

      - name: Build .aar
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build.sh android

      - name: Upload .aar
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-core-android
          path: android/app/libs/iykyk-core.aar
          if-no-files-found: error
