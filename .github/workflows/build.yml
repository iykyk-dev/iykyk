name: Build

on:
  push:
    branches: [main]
    # A tag v1.2.3 (or v1.2.3-beta1) publishes a signed release; paths are not
    # checked for tags.
    tags: ["v*"]
    paths:
      - "android/**"
      - "core/**"
      - "VERSION"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 32-bit ARM too: older phones and most Android TV boxes.
  ANDROID_TARGETS: android/arm64,android/arm,android/amd64
  CORE_TEST_TAGS: engine,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0

jobs:
  core:
    name: Core (Go → .aar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The core takes ~15 minutes to build; reuse it while core/ is unchanged.
      - name: Restore core from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: android/app/libs/iykyk-core.aar
          key: core-android-${{ env.ANDROID_TARGETS }}-${{ hashFiles('core/**') }}

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Set up JDK 21
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Pins the versions from build.sh and tidies go.mod/go.sum; a no-op when
      # nothing changed. Changes are committed back at the end of the job.
      - name: Resolve dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build.sh deps

      - name: Download rule sets for tests
        if: steps.cache.outputs.cache-hit != 'true'
        run: ../scripts/download-rulesets.sh "$RUNNER_TEMP/rulesets"

      - name: Test (link parsing + configs checked by sing-box and Xray)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          IYKYK_RULESET_DIR: ${{ runner.temp }}/rulesets
        run: go test -count=1 -tags "$CORE_TEST_TAGS" -ldflags=-checklinkname=0 ./iykyk/

      - name: Build .aar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build.sh android

      - name: Upload .aar
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-core-android
          path: android/app/libs/iykyk-core.aar
          if-no-files-found: error
          retention-days: 3

      - name: Commit go.mod/go.sum if they changed
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Core: update go.mod/go.sum"
            git push
          fi

  windows-core:
    name: Windows core (iykyk-service.exe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Resolve dependencies
        run: ./build.sh deps

      - name: Vet for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,badlinkname,tfogo_checklinkname0" \
            ./cmd/iykyk-service/ ./iykyk/

      - name: Build
        run: ./build.sh windows

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-service-windows
          path: core/build/windows/iykyk-service.exe
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android APK
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download core
        uses: actions/download-artifact@v8
        with:
          name: iykyk-core-android
          path: android/app/libs

      # Fresh Russian domain/IP lists for the "bypass Russian sites" option,
      # shipped inside the APK so the app never has to reach GitHub.
      - name: Download rule sets into the app
        run: ../scripts/download-rulesets.sh app/src/main/assets/rulesets

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The test build (app.iykyk.client.debug) for testers, on every push to main.
      - name: Build the test version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # The release build (app.iykyk.client), signed with the key from the secrets.
      # On main it is built too, so R8 problems show up before a release.
      - name: Build the release
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::A release needs the RELEASE_KEYSTORE secrets"; exit 1
          fi
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION_ARG="-PappVersion=$GITHUB_REF_NAME"; fi
          ./gradlew :app:assembleRelease $VERSION_ARG --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/release"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp app/build/outputs/apk/release/app-$abi-release.apk "$RUNNER_TEMP/release/IYKYK-$abi.apk"
          done
          cp app/build/outputs/apk/release/app-universal-release.apk "$RUNNER_TEMP/release/IYKYK.apk"
          # The signing certificate's fingerprint (public) for the site and Settings.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/release/IYKYK.apk" | grep -i "SHA-256" | tee "$RUNNER_TEMP/release/signature.txt"
          ls -l "$RUNNER_TEMP/release"

      - name: Upload the release APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-android-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

      # Renders the main screens to images and prints them into the log
      # (base64), for design review without a device.
      - name: Screenshots
        continue-on-error: true
        run: |
          ./gradlew :shared:desktopTest --tests "app.iykyk.client.ui.Screenshots" --stacktrace
          for f in shared/build/screenshots/*.jpg; do
            echo "=== SCREENSHOT $(basename "$f") ==="
            base64 -w0 "$f"; echo
            echo "=== END ==="
          done

      - name: Name the test APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-universal-debug.apk "$RUNNER_TEMP/apk/IYKYK-test.apk"

      - name: Upload the test APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-test-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/IYKYK-test.apk
          if-no-files-found: error
          retention-days: 3

      # Test builds live in their own pre-release "test", replaced on every push,
      # so they never become "latest" (what clients and the updater see).
      - name: Publish the test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test "$RUNNER_TEMP/apk/IYKYK-test.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Тестовая сборка ${{ github.run_number }}" \
            --notes "Для тестировщиков: отдельное приложение «IYKYK тест», ставится рядом с основным. Коммит ${GITHUB_SHA::7}."

  windows-app:
    name: Windows app (IYKYK-Setup.exe)
    needs: [windows-core, android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download core service
        uses: actions/download-artifact@v8
        with:
          name: iykyk-service-windows
          path: core-dist

      - name: Download rule sets
        run: scripts/download-rulesets.sh core-dist/rulesets

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the app image
        working-directory: android
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION_ARG="-PappVersion=$GITHUB_REF_NAME"; fi
          ./gradlew :desktop:createDistributable $VERSION_ARG --stacktrace

      - name: Build the installer
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # Git Bash would turn /D... and /O... into paths.
          export MSYS_NO_PATHCONV=1
          "$ISCC" \
            "/DAppImage=$(cygpath -w "$PWD/android/desktop/build/compose/binaries/main/app/IYKYK")" \
            "/DCoreDir=$(cygpath -w "$PWD/core-dist")" \
            "/DAppVersion=$(if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "${GITHUB_REF_NAME#v}" | cut -d- -f1; else cat VERSION; fi).${{ github.run_number }}" \
            "/O$(cygpath -w "$PWD/dist")" \
            android/desktop/installer/iykyk.iss
          ls -l dist

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-windows-${{ github.run_number }}
          path: dist/IYKYK-Setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Add to the test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload test dist/IYKYK-Setup.exe --clobber -R "$GITHUB_REPOSITORY"

  # Tag v1.2.3: one GitHub release with every file + version.json for the
  # in-app updater. A tag with "-" (v1.2.3-beta1) is a pre-release: the updater
  # of normal copies does not see it.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android
        uses: actions/download-artifact@v8
        with:
          name: iykyk-android-release
          path: dist

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: iykyk-windows-${{ github.run_number }}
          path: dist

      - name: Write version.json and the notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/release-manifest.py "$TAG" "$REPO" dist RELEASE_NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS="--latest"
          if [[ "$TAG" == *-* ]]; then FLAGS="--prerelease --latest=false"; fi
          gh release delete "$TAG" --yes || true
          # The old single "latest" release from before 1.0 is replaced by real ones.
          gh release delete latest --yes --cleanup-tag || true
          gh release create "$TAG" dist/IYKYK.apk dist/IYKYK-*.apk dist/IYKYK-Setup.exe dist/version.json \
            --verify-tag $FLAGS \
            --title "IYKYK ${TAG#v}" \
            --notes-file dist/notes.md
