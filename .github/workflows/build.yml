name: Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_TEST_TAGS: engine,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0

jobs:
  core:
    name: Core (Go → .aar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The core takes ~15 minutes to build; reuse it while core/ is unchanged.
      - name: Restore core from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: android/app/libs/iykyk-core.aar
          key: core-android-${{ hashFiles('core/**') }}

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Set up JDK 21
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Pins the versions from build.sh and tidies go.mod/go.sum; a no-op when
      # nothing changed. Changes are committed back at the end of the job.
      - name: Resolve dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build.sh deps

      - name: Download rule sets for tests
        if: steps.cache.outputs.cache-hit != 'true'
        run: ../scripts/download-rulesets.sh "$RUNNER_TEMP/rulesets"

      - name: Test (link parsing + configs checked by sing-box and Xray)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          IYKYK_RULESET_DIR: ${{ runner.temp }}/rulesets
        run: go test -count=1 -tags "$CORE_TEST_TAGS" -ldflags=-checklinkname=0 ./iykyk/

      - name: Build .aar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build.sh android

      - name: Upload .aar
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-core-android
          path: android/app/libs/iykyk-core.aar
          if-no-files-found: error
          retention-days: 3

      - name: Commit go.mod/go.sum if they changed
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Core: update go.mod/go.sum"
            git push
          fi

  windows-core:
    name: Windows core (iykyk-service.exe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Resolve dependencies
        run: ./build.sh deps

      - name: Vet for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,badlinkname,tfogo_checklinkname0" \
            ./cmd/iykyk-service/ ./iykyk/

      - name: Build
        run: ./build.sh windows

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-service-windows
          path: core/build/windows/iykyk-service.exe
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android APK
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download core
        uses: actions/download-artifact@v8
        with:
          name: iykyk-core-android
          path: android/app/libs

      # Fresh Russian domain/IP lists for the "bypass Russian sites" option,
      # shipped inside the APK so the app never has to reach GitHub.
      - name: Download rule sets into the app
        run: ../scripts/download-rulesets.sh app/src/main/assets/rulesets

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/apk/IYKYK.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: iykyk-debug-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/IYKYK.apk
          if-no-files-found: error
          retention-days: 3

      # One release only: every build on main replaces it, so
      # https://github.com/iykyk-dev/iykyk/releases/latest/download/IYKYK.apk
      # always gives the newest APK (the project page will link here).
      - name: Publish as the only release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/apk/IYKYK.apk" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "IYKYK, сборка ${{ github.run_number }}" \
            --notes "Тестовая сборка для Android (подписана отладочным ключом). Коммит ${GITHUB_SHA::7}."
