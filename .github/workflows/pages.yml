name: Site

# The project page app.dlyasvoih.xyz (GitHub Pages): redeployed when the site
# changes and after every build, so it always offers the newest release.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-release.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Newest release for the download buttons
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site-release.py site "$GITHUB_REPOSITORY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
