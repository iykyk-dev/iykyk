name: Devices service

on:
  push:
    branches: [main]
    paths:
      - "server/devices/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Test and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Test
        working-directory: server/devices
        run: go vet ./... && go test ./...

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: server/devices
          push: true
          tags: ghcr.io/iykyk-dev/iykyk-devices:latest
